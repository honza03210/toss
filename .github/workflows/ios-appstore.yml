# Builds the iOS app on a Mac and uploads it to App Store Connect (TestFlight first; submit for
# review in App Store Connect). Run it from the Actions tab, or push an ios-v* tag.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   ASC_KEY_ID        App Store Connect API key ID
#   ASC_ISSUER_ID     its issuer ID
#   ASC_KEY_P8        the .p8 key file's contents (the key needs the Admin role for cloud signing)
#   APPLE_TEAM_ID     your team ID (developer.apple.com > Membership)
name: iOS App Store
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
  push:
    tags: ["ios-v*"]

jobs:
  upload:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios/AppStore
        run: python3 make_plists.py && xcodegen generate
      - name: API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
      - name: Archive
        working-directory: ios/AppStore
        env:
          VERSION: ${{ github.event.inputs.version || '' }}
        run: |
          version="${VERSION:-${GITHUB_REF_NAME#ios-v}}"
          xcodebuild archive \
            -project Toss.xcodeproj -scheme Toss -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Toss.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            MARKETING_VERSION="$version" CURRENT_PROJECT_VERSION="${{ github.run_number }}"
      - name: Upload to App Store Connect
        working-directory: ios/AppStore
        run: |
          /usr/libexec/PlistBuddy -c "Add :teamID string ${{ secrets.APPLE_TEAM_ID }}" ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Toss.xcarchive" -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"
      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
