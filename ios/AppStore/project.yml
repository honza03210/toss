# XcodeGen spec for App Store builds on macOS (CI: .github/workflows/ios-appstore.yml).
# Day-to-day development builds use xtool on Linux instead (see ../README.md); both build the
# same Swift package (..), this adds what App Store Connect requires: an asset-catalog icon,
# version numbers and distribution signing.
#   python3 make_plists.py && xcodegen generate
name: Toss
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  TossPackage:
    path: ..
targets:
  Toss:
    type: application
    platform: iOS
    sources:
      - Stubs/App
      - Assets.xcassets
      - path: ../PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: TossPackage
        product: Toss
      - target: TossShare
        embed: true
    settings:
      base:
        PRODUCT_NAME: Toss
        PRODUCT_BUNDLE_IDENTIFIER: com.honza.Toss
        INFOPLIST_FILE: Generated/Toss-Info.plist
        CODE_SIGN_ENTITLEMENTS: ../Toss.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
  TossShare:
    type: app-extension
    platform: iOS
    sources:
      - Stubs/Share
      - path: ../PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: TossPackage
        product: TossShare
    settings:
      base:
        PRODUCT_NAME: TossShare
        PRODUCT_BUNDLE_IDENTIFIER: com.honza.Toss.TossShare
        INFOPLIST_FILE: Generated/TossShare-Info.plist
        CODE_SIGN_ENTITLEMENTS: ../TossShare.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
schemes:
  Toss:
    build:
      targets:
        Toss: all
    archive:
      config: Release
